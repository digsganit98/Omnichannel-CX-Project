services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/cx_phase1.db
      # Defaults match the real Gmail relay in .env. They used to point at a local mailpit
      # catcher, which was removed 2026-09-23: .env already sent every mail through Gmail,
      # so mailpit received nothing.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-support@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      OPENSEARCH_URL: http://opensearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-me-32chars}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_LOCAL_TEST_MODE: ${WHATSAPP_LOCAL_TEST_MODE:-false}
      WHATSAPP_TEST_SIGNATURE: ${WHATSAPP_TEST_SIGNATURE:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      OUTBOUND_DELIVERY_MODE: ${OUTBOUND_DELIVERY_MODE:-log}
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_POLL_INTERVAL_SECONDS: ${IMAP_POLL_INTERVAL_SECONDS:-30}
      CRM_PROVIDER: ${CRM_PROVIDER:-disabled}
      CRM_BASE_URL: ${CRM_BASE_URL:-}
      CRM_API_TOKEN: ${CRM_API_TOKEN:-}
      CRM_USER_EMAIL: ${CRM_USER_EMAIL:-}
      CRM_PROJECT_KEY: ${CRM_PROJECT_KEY:-}
      CRM_ISSUE_TYPE: ${CRM_ISSUE_TYPE:-Task}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bfsi-password}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LLM_OBSERVABILITY_ENABLED: ${LLM_OBSERVABILITY_ENABLED:-true}
      # AWS Bedrock standard tier, Asia Pacific (Mumbai), 2026-09-10.
      LLM_COST_RATES_JSON: '${LLM_COST_RATES_JSON:-{"openai/gpt-oss-20b":{"input":0.08,"output":0.35},"openai/gpt-oss-120b":{"input":0.18,"output":0.71}}}'
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_IO: ${LANGFUSE_CAPTURE_IO:-false}
    command: >
      sh -c "python -m services.persistence_service.migrate &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8888:8000"
    volumes:
      - cx-data:/app/data
      - huggingface-cache:/root/.cache/huggingface
      - ./apps/admin-ui:/app/apps/admin-ui
    depends_on:
      # ollama:                      # commented out with the ollama service below
      #   condition: service_started # - leave this in and compose fails on an
      #                              #   undefined dependency.
      # opensearch:                   # commented out with the opensearch service below
      #   condition: service_healthy  # - leave this in and compose fails on an
      #                               #   undefined dependency.
      neo4j:
        condition: service_healthy

  # Not started by `docker compose up` - only `docker compose --profile tunnel up`.
  # ngrok is the WhatsApp webhook's public entry point, and a reserved free-tier domain
  # allows ONE online session. The hosted instance holds the team domain, so a laptop
  # starting this either dies with ERR_NGROK_334 or steals the tunnel and receives real
  # customers' WhatsApp messages. Nothing depends_on ngrok, so gating it starts nothing
  # else late. The hosted instance is started by hand and must pass --profile tunnel.
  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    # The default used to be the TEAM's reserved domain, so an unset NGROK_DOMAIN
    # silently contended for the tunnel the hosted instance is using. It now falls back
    # to a plain `http api:8000`, which ngrok answers with a random ephemeral URL - no
    # use as a webhook, but it takes nothing from anyone. Set NGROK_DOMAIN to your own
    # reserved domain to get a stable one.
    #
    # `${VAR:?message}` was tried here and is wrong: compose interpolates the whole file
    # before it filters profiles, so a missing variable breaks EVERY compose command,
    # including ones that never touch this service.
    command: http ${NGROK_DOMAIN:+--url=${NGROK_DOMAIN}} --log=stdout api:8000
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_started

  # OpenSearch was the original KB vector store. Commented out 2026-09-16 for the same
  # reason as ollama: nothing reads it. RAG_BACKEND=neo4j in .env, and
  # services/rag_service/config.py defaults to "neo4j" even when the variable is unset,
  # so the KB lives in Neo4j (`:KBChunk`, index kb_chunk_embedding) and every query goes
  # there. Measured on the 2026-09-16 fresh start: with opensearch untouched, the KB
  # indexed 14/14 into neo4j_vector and linked 123 holdings - opensearch held nothing and
  # served nothing while running, costing 512 MB of heap and a 2.33 GB image.
  #
  # It was kept this long as the rollback for RAG_BACKEND=opensearch; that path still
  # exists in code and is unchanged. Note EC2 keeps opensearch RUNNING for exactly that
  # reason (re-pulling 1.34 GB onto a 94%-full shared disk may fail) - do not copy this
  # edit there. Locally the image is already on disk, so uncommenting restores it.
  #
  # To bring it back: uncomment this, the api's `depends_on: opensearch` above, and the
  # opensearch-data volume below, set RAG_BACKEND=opensearch in .env, then
  # `docker compose up -d` and POST /admin/rag/index?recreate=true to rebuild the index.
  #
  # opensearch:
  #   image: opensearchproject/opensearch:2.17.1
  #   environment:
  #     - discovery.type=single-node
  #     - DISABLE_SECURITY_PLUGIN=true
  #     - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - opensearch-data:/usr/share/opensearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 20

  # Ollama is the offline fallback LLM for when Groq is unreachable or out of quota.
  # Commented out 2026-09-16, matching what EC2 already did, because the fallback was
  # never actually live here: `.env` has OLLAMA_ENABLED=false, so OllamaGenerator
  # short-circuits before it ever calls out, and the ollama-data volume was 32 kB -
  # SSH keys and empty models/ and cache/ dirs, meaning no model was ever pulled. The
  # image is 8.24 GB. EC2 removed it for disk (94% full); local kept it only because
  # nobody noticed. Nothing in Python breaks - the fallback path was already dead.
  #
  # To bring it back: uncomment this, the api's `depends_on: ollama` above, and the
  # ollama-data volume below, then `docker compose --profile setup run --rm ollama-pull`
  # to actually pull a model, and set OLLAMA_ENABLED=true in .env.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #
  # ollama-pull:
  #   image: ollama/ollama:latest
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #   entrypoint: ["/bin/sh"]
  #   command: ["-c", "sleep 8 && ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
  #   depends_on:
  #     - ollama
  #   profiles:
  #     - setup

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-bfsi-password}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  cx-data:
  # opensearch-data:    # commented out with the opensearch service above
  # ollama-data:        # commented out with the ollama service above
  huggingface-cache:
  neo4j-data:
