services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/cx_phase1.db
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-support@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      OPENSEARCH_URL: http://opensearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_LOCAL_TEST_MODE: ${WHATSAPP_LOCAL_TEST_MODE:-false}
      WHATSAPP_TEST_SIGNATURE: ${WHATSAPP_TEST_SIGNATURE:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      OUTBOUND_DELIVERY_MODE: ${OUTBOUND_DELIVERY_MODE:-log}
      CRM_PROVIDER: ${CRM_PROVIDER:-disabled}
      CRM_BASE_URL: ${CRM_BASE_URL:-}
      CRM_API_TOKEN: ${CRM_API_TOKEN:-}
      CRM_USER_EMAIL: ${CRM_USER_EMAIL:-}
      CRM_PROJECT_KEY: ${CRM_PROJECT_KEY:-}
      CRM_ISSUE_TYPE: ${CRM_ISSUE_TYPE:-Task}
    command: >
      sh -c "python -m services.persistence_service.migrate &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - cx-data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh"]
    command: ["-c", "sleep 8 && ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      - ollama
    profiles:
      - setup

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cx-data:
  opensearch-data:
  ollama-data:
  huggingface-cache:
